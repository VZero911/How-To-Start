# ALICE GENERAL — Minimum Docker deploy.
#
# One self-contained worker node that connects back to the coordinator service.
# No secrets, no model calls — the node receives tasks and reports results.
#
#   docker compose up -d --build
#   curl http://localhost:8080/status

services:
  alice-general:
    build: .
    container_name: alice-general
    restart: unless-stopped
    ports:
      - "localhost:8080:8080"
    environment:
      ALICE_ROLE: GENERAL
      ALICE_PORT: "8080"
      # Point these to your the coordinator service / dashboard server.
      # localhost = the Docker host machine.
      DASHBOARD_HOST: ${DASHBOARD_HOST:-localhost}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8083}
      COORDINATOR_HOST: ${COORDINATOR_HOST:-localhost}
      COORDINATOR_PORT: ${COORDINATOR_PORT:-8082}
      X402_HOST: ${X402_HOST:-localhost}
      X402_PORT: ${X402_PORT:-8084}
      DELEGATION_HOST: ${DELEGATION_HOST:-localhost}
      DELEGATION_PORT: ${DELEGATION_PORT:-8085}
    extra_hosts:
      - "localhost:host-gateway"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
